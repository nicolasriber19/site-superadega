# Publica o site no GitHub Pages a cada push na main.
# Baseado no exemplo oficial do Vite: https://vite.dev/guide/static-deploy (seção GitHub Pages).
# As ações estão fixadas pelo SHA do commit (o comentário diz a versão), conferido em 22/10/2026.
# Endereço: https://nicolasriber19.github.io/site-superadega/ (base em vite.config.js)
name: Publicar no GitHub Pages

on:
  # Roda a cada push na branch main
  push:
    branches: ['main']

  # Também dá para rodar à mão na aba Actions
  workflow_dispatch:

# Permissões mínimas para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; uma nova cancela a anterior
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Instalar dependências (vite e, para os testes, @playwright/test)
        run: npm ci
      - name: Gerar o site (dist/)
        run: npm run build
      - name: Configurar o Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
